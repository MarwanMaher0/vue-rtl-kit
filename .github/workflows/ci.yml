name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run --exclude test/nuxt.spec.ts

      - name: Build library
        run: npm run build

      - name: Bundle size budgets
        run: npm run check:size

      - name: Nuxt SSR test
        run: npx vitest run test/nuxt.spec.ts

      - name: Build playground
        run: npx vite build -c playground/vite.config.ts

  examples:
    name: Example / ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [vite, nuxt]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/${{ matrix.example }}/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install example
        run: npm ci
        working-directory: examples/${{ matrix.example }}

      - name: Build example
        run: npm run build
        working-directory: examples/${{ matrix.example }}
