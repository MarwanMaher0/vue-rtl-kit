name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (with coverage thresholds)
        run: npx vitest run --coverage --exclude test/nuxt.spec.ts

      - name: Build library
        run: npm run build

      - name: Publish readiness (publint + attw)
        run: npm run check:publish

      - name: Bundle size budgets
        run: npm run check:size

      - name: Type tests (global components and directive against dist)
        run: npm run test:types

      - name: Tree-shaking
        run: npm run check:treeshake

      - name: Nuxt SSR test
        run: npx vitest run test/nuxt.spec.ts

      - name: Build playground
        run: npx vite build -c playground/vite.config.ts

  vue-compat:
    # package.json allows vue ^3.3.0; the default job only sees the Vue that
    # package-lock pins. Vue < 3.5 has no `app.onUnmount`, so this also covers
    # the unmount fallback in src/core.ts. @vue/test-utils >= 2.4.6 itself needs
    # Vue 3.5, hence the 2.4.5 pin. Type-checking stays on the pinned Vue.
    name: Vue ${{ matrix.vue }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue: ['3.3', '3.4']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Vue ${{ matrix.vue }}
        run: >
          npm install --no-save --no-audit --no-fund
          vue@${{ matrix.vue }}
          @vue/server-renderer@${{ matrix.vue }}
          @vue/compiler-sfc@${{ matrix.vue }}
          @vue/test-utils@2.4.5

      - name: Verify resolved versions
        run: |
          node -e "
            const v = p => JSON.parse(require('fs').readFileSync('node_modules/' + p + '/package.json', 'utf8')).version
            console.log('vue', v('vue'), '| @vue/server-renderer', v('@vue/server-renderer'), '| @vue/test-utils', v('@vue/test-utils'))
            if (!v('vue').startsWith('${{ matrix.vue }}.')) process.exit(1)
            if (v('@vue/server-renderer') !== v('vue')) process.exit(1)
          "

      - name: Unit tests
        run: npx vitest run --exclude test/nuxt.spec.ts

  nuxt4:
    # @nuxt/kit peer range is ^3 || ^4; the default job only exercises Nuxt 3.
    # Nuxt 4 needs a current Node 22; --legacy-peer-deps only resolves the
    # optional jsdom peer of @nuxt/test-utils 4 (we stay on vitest 2 / jsdom 25).
    name: Nuxt 4
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Nuxt 4
        run: >
          npm install --no-save --no-audit --no-fund --legacy-peer-deps
          nuxt@4 @nuxt/kit@4 @nuxt/schema@4 @nuxt/test-utils@4

      - name: Verify resolved versions
        run: |
          node -e "
            const v = p => JSON.parse(require('fs').readFileSync('node_modules/' + p + '/package.json', 'utf8')).version
            console.log('nuxt', v('nuxt'), '| @nuxt/kit', v('@nuxt/kit'), '| @nuxt/test-utils', v('@nuxt/test-utils'))
            if (!v('nuxt').startsWith('4.') || !v('@nuxt/kit').startsWith('4.')) process.exit(1)
          "

      - name: Build library
        run: npm run build

      - name: Nuxt SSR test (test/fixtures/basic + cookie fixture)
        run: npx vitest run test/nuxt.spec.ts

  node20-11:
    # engines.node is >=20.11; some devDependencies require a newer Node 20.x,
    # so the package is built on current Node 20 and then consumed on Node
    # 20.11.0 through both the ESM and the CJS entry.
    name: Node 20.11 (consume dist)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build library on Node 20
        run: npm run build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.11.0'

      - name: Import dist through ESM and CJS on Node 20.11
        run: |
          node --version
          node test/dist-smoke.mjs

  examples:
    name: Example / ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [vite, nuxt]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/${{ matrix.example }}/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install example
        run: npm ci
        working-directory: examples/${{ matrix.example }}

      - name: Build example
        run: npm run build
        working-directory: examples/${{ matrix.example }}

      - name: Check server-rendered locale with and without a cookie
        if: matrix.example == 'nuxt'
        working-directory: examples/nuxt
        shell: bash
        env:
          HOST: 127.0.0.1
          PORT: '4173'
        run: |
          node .output/server/index.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          url="http://$HOST:$PORT/"

          for attempt in {1..30}; do
            if curl -fs --max-time 2 "$url" -o /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Nuxt server exited before it became ready' >&2
              exit 1
            fi
            if (( attempt == 30 )); then
              echo 'Nuxt server did not become ready' >&2
              exit 1
            fi
            sleep 1
          done

          check_html() {
            local dir=$1 lang=$2 tag
            shift 2
            tag=$(curl -fsS --max-time 10 "$@" "$url" | grep -oE '<html[[:space:]][^>]*>' | head -n 1 || true)
            echo "${*:-no cookie}: ${tag:-<no html tag>}"
            if ! grep -qF " dir=\"$dir\"" <<<"$tag" || ! grep -qF " lang=\"$lang\"" <<<"$tag"; then
              echo "Expected dir=\"$dir\" lang=\"$lang\" (${*:-no cookie}), got: ${tag:-<no html tag>}" >&2
              return 1
            fi
          }
          check_html rtl ar
          check_html ltr en --cookie 'rtl-example=en'

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

  docs:
    name: Docs check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - name: Check documentation
        run: npm run docs:check

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref != 'changeset-release/main' ||
      github.event.pull_request.head.repo.full_name != github.repository)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check changeset status
        run: npx changeset status --since=origin/main
